name: Documentation Request
description: Request a new guide, code example, or expanded documentation topic for the Nepali Date Library.
title: "[Doc Request]: "
labels: ["documentation", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea or need documentation for a feature, guide, or tutorial in **Nepali Date**? Let us know!
  - type: dropdown
    id: ecosystem
    attributes:
      label: Target Ecosystem / Language
      description: Which language or ecosystem does this request apply to?
      options:
        - "Node.js / TypeScript"
        - "Python"
        - "PHP"
        - "General / Multi-language Ecosystem"
        - "Interactive Date Converter Suite"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: topic
    attributes:
      label: Requested Topic or Guide
      description: What topic, function, method, or use case needs documentation or expansion?
      placeholder: "e.g. Guide on fiscal year calculations in PHP, formatting dates in Python, or timezone considerations."
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation and Use Case
      description: Why is this guide or example needed, and how will it benefit developers?
      placeholder: Explain the problem or scenario you are solving with Nepali Date.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any links, references, or proposed outlines.
      placeholder: Add any extra details or examples if available.
    validations:
      required: false
